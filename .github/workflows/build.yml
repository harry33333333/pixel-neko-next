name: Build and Release OS ISO

on:
  push:
    branches: [ "main", "beta" ]
  pull_request:
    branches: [ "main", "beta" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        timeout 180s sudo apt-get -o Acquire::Retries=2 \
          -o Acquire::http::Timeout=20 \
          -o Acquire::https::Timeout=20 update || true
        sudo apt-get install -y gcc-multilib nasm grub-pc-bin grub-common \
          xorriso mtools dos2unix zip

    - name: Ensure Unix line endings and permissions
      run: |
        dos2unix scripts/build_counter.sh || sed -i 's/\r$//' scripts/build_counter.sh
        chmod +x scripts/build_counter.sh

    - name: Build Kernel and ISO
      run: |
        set -o pipefail
        make 2>&1 | tee make.log
        VERSION=$(grep "KERNEL_BUILD" include/version.h | head -1 | cut -d '"' -f 2)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
        # Create the source archive as a release asset.
        git archive --format=zip --output="pixel_neko_source_${VERSION}.zip" HEAD

    - name: Step Summary and Diagnostics
      if: always()
      run: |
        if [ -f make.log ]; then
          echo "### Build Log Output" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 150 make.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Bootable ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pixel-neko-bootable-iso
        path: pixel_neko*.iso
        if-no-files-found: error

    - name: Publish GitHub Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: "Pixel Neko Next ${{ env.TAG_NAME }}"
        body: |
          ## Pixel Neko Next ${{ env.TAG_NAME }}

          ### Release Assets
          - Bootable ISO image: `pixel_neko_build_${{ env.VERSION }}.iso`
          - Source archive: `pixel_neko_source_${{ env.VERSION }}.zip`
          - Build commit: `${{ github.sha }}`

          ### Running
          - QEMU: `qemu-system-i386 -cdrom pixel_neko_build_${{ env.VERSION }}.iso -m 128M -boot d`
          - VirtualBox / VMware: create a 32-bit Other/Unknown virtual machine and boot this ISO.

          ### Highlights
          - Native x86-32 bare-metal graphical desktop built with C, NASM, Multiboot and GRUB.
          - Multi-backend graphics for VBE, VMware SVGA II, ATI Mach64/Rage II+ and NVIDIA G7x, with resolution, color-depth and framebuffer fallback handling.
          - Multi-platform audio for Intel/VMware HDAudio, VIA VT1708S, Ensoniq ES1371/CT4810, CMI8738/C3DX and AC'97, including 44.1kHz and 48kHz PCM.
          - Unified PCI/BAR, IRQ, DMA, MMIO, physical-memory, driver-registration and error-fallback platform layers.
          - VFS with Windows-style drive letters, FAT12/16/32, ISO9660/Joliet, MBR partitions, ATA/ATAPI storage and native floppy support.
          - Integrated file manager, editor, media player, image viewer, control panel, system information, calculator, puzzle and installer applications.
          - Native USB 2.0 EHCI and USB 1.1 UHCI host controllers, Rate Matching Hub (RMH) and Transaction Translator (TT) support, and FreeBSD-derived USB HID keyboard and mouse drivers with responsive single/double click handling.
          - Retro boot animation, PS/2 keyboard and mouse input with latched button edges and reliable double-click handling, staged power management, serial diagnostics and graphical crash recovery.
          - Reproducible Makefile builds and GitHub Actions release automation for bootable ISO and source archives.
        draft: false
        prerelease: false
        files: |
          pixel_neko*.iso
          pixel_neko_source_*.zip
